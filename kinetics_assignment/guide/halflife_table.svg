<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: Cambria, Georgia, "Times New Roman", serif; fill: #1a1a1a; }
    .hdr  { font-size: 15px; font-weight: 700; }
    .eq   { font-size: 15px; }
    .sub  { font-size: 10px; baseline-shift: sub; }
    .it   { font-style: italic; }
    .grid  { stroke: #999; stroke-width: 1; }
    .outer { stroke: #333; stroke-width: 1.5; fill: none; }
    .hdrbg { fill: #eef1f4; }
  </style>

  <!-- columns: 1 | 70 | 320 | 560 | 799   rows: 1 | 44 | 96 | 148 | 200 -->
  <rect class="hdrbg" x="1" y="1" width="798" height="43"/>
  <rect class="outer" x="1" y="1" width="798" height="198"/>

  <line class="grid" x1="70"  y1="1" x2="70"  y2="199"/>
  <line class="grid" x1="320" y1="1" x2="320" y2="199"/>
  <line class="grid" x1="560" y1="1" x2="560" y2="199"/>
  <line class="grid" x1="1" y1="44"  x2="799" y2="44"/>
  <line class="grid" x1="1" y1="96"  x2="799" y2="96"/>
  <line class="grid" x1="1" y1="148" x2="799" y2="148"/>

  <!-- header -->
  <text class="hdr" x="14"  y="28">Order</text>
  <text class="hdr" x="82"  y="28">Integrated rate law</text>
  <text class="hdr" x="332" y="28">Time for fraction <tspan class="it">f</tspan> remaining, t<tspan class="sub">F</tspan></text>
  <text class="hdr" x="572" y="28">Half-life, t<tspan class="sub">&#189;</tspan></text>

  <!-- row: 0th order -->
  <text class="eq" x="30"  y="76">0</text>
  <text class="eq" x="82"  y="76">[A] = [A]<tspan class="sub">0</tspan> &#8722; k&#183;t</text>
  <text class="eq" x="332" y="76">t<tspan class="sub">F</tspan> = [A]<tspan class="sub">0</tspan>(1 &#8722; <tspan class="it">f</tspan>) / k</text>
  <text class="eq" x="572" y="76">t<tspan class="sub">&#189;</tspan> = [A]<tspan class="sub">0</tspan> / (2k)</text>

  <!-- row: 1st order -->
  <text class="eq" x="30"  y="128">1</text>
  <text class="eq" x="82"  y="128">ln[A] = ln[A]<tspan class="sub">0</tspan> &#8722; k&#183;t</text>
  <text class="eq" x="332" y="128">t<tspan class="sub">F</tspan> = ln(1 / <tspan class="it">f</tspan>) / k</text>
  <text class="eq" x="572" y="128">t<tspan class="sub">&#189;</tspan> = ln 2 / k</text>

  <!-- row: 2nd order -->
  <text class="eq" x="30"  y="180">2</text>
  <text class="eq" x="82"  y="180">1/[A] = 1/[A]<tspan class="sub">0</tspan> + k&#183;t</text>
  <text class="eq" x="332" y="180">t<tspan class="sub">F</tspan> = (1 &#8722; <tspan class="it">f</tspan>) / (<tspan class="it">f</tspan>&#183;k&#183;[A]<tspan class="sub">0</tspan>)</text>
  <text class="eq" x="572" y="180">t<tspan class="sub">&#189;</tspan> = 1 / (k&#183;[A]<tspan class="sub">0</tspan>)</text>
</svg>
