<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .hdr { font-size: 15px; font-weight: 700; fill: #1a1a1a; }
    .cell { font-size: 14px; fill: #1a1a1a; }
    .grid { stroke: #999; stroke-width: 1; }
    .outer { stroke: #333; stroke-width: 1.5; fill: none; }
    .hdrbg { fill: #eef1f4; }
  </style>

  <!-- column x positions: 0 | 90 | 380 | 570 | 720 -->
  <!-- row y positions: 0 | 44 | 88 | 132 | 176 -->

  <!-- header background -->
  <rect class="hdrbg" x="1" y="1" width="718" height="43"/>

  <!-- outer border -->
  <rect class="outer" x="1" y="1" width="718" height="174"/>

  <!-- vertical grid lines -->
  <line class="grid" x1="90"  y1="1" x2="90"  y2="175"/>
  <line class="grid" x1="380" y1="1" x2="380" y2="175"/>
  <line class="grid" x1="570" y1="1" x2="570" y2="175"/>

  <!-- horizontal grid lines -->
  <line class="grid" x1="1" y1="44"  x2="719" y2="44"/>
  <line class="grid" x1="1" y1="88"  x2="719" y2="88"/>
  <line class="grid" x1="1" y1="132" x2="719" y2="132"/>

  <!-- header text -->
  <text class="hdr" x="14"  y="28">Order</text>
  <text class="hdr" x="104" y="28">Plot this vs. time for a straight line</text>
  <text class="hdr" x="394" y="28">The slope equals</text>
  <text class="hdr" x="584" y="28">Unit of k</text>

  <!-- order labels -->
  <text class="cell" x="14" y="72">0</text>
  <text class="cell" x="14" y="116">1</text>
  <text class="cell" x="14" y="160">2</text>
</svg>
